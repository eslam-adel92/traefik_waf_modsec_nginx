global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  # No authentication. Safe only because the compose file publishes port 8080
  # to 127.0.0.1 exclusively. Do not expose it on 0.0.0.0.
  insecure: true

# Ranges of a CDN/proxy sitting IN FRONT of this gateway. Traefik keeps the
# X-Forwarded-* headers a trusted peer sends and rewrites them for everyone
# else, so this is what makes the real client IP visible instead of the
# proxy's - without it, ratelimit and inflight count every visitor arriving
# through one CDN edge as a single source and throttle real traffic.
#
# The README's "never add untrusted trustedIPs" warning still stands: list ONLY
# ranges you actually sit behind. Trusting a peer means believing its
# X-Forwarded-Host too, which is what host-scoped WAF rules key on - so every
# router MUST also overwrite X-Forwarded-Host with its own literal hostname.
# See README "Behind Cloudflare".
#
# Static config cannot expand environment variables, so these are literal, and
# a YAML anchor is not an option either - Traefik rejects unknown top-level keys
# ("field not found"), so the list is repeated verbatim under each entryPoint.
# Refresh both copies with scripts/update-cf-ips.sh, which also prints the
# matching TRUSTED_PROXY_IPS line for .env.
# Cloudflare, fetched 2026-08-11.

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    # Same list as the `web` entryPoint above - keep the two in sync.
    forwardedHeaders:
      trustedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
    transport:
      respondingTimeouts:
        # Long enough for large uploads on the `waf-uploads` chain. A long
        # read timeout is what makes slowloris possible; the bound on it is
        # the `inflight` middleware, which caps concurrent requests per IP.
        # Lower this if you do not serve large uploads.
        readTimeout: "600s"
        # No write timeout, so long downloads/streaming are not cut off.
        writeTimeout: "0s"
        idleTimeout: "180s"
      lifeCycle:
        graceTimeOut: "10s"
    http:
      # TLS on by default using Traefik's self-signed certificate. Routers opt
      # into ACME individually with `tls.certresolver=letsencrypt` (driven by
      # CERT_RESOLVER in .env), so routers that cannot get a public cert - the
      # bare-IP catch-all, or any .localhost/.test domain - never trigger
      # failing ACME requests against your rate limit.
      tls: {}

serversTransport:
  forwardingTimeouts:
    dialTimeout: "30s"
    responseHeaderTimeout: "600s"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: webproxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

experimental:
  plugins:
    modsecurity:
      moduleName: github.com/acouvreur/traefik-modsecurity-plugin
      version: v1.3.0

certificatesResolvers:
  letsencrypt:
    acme:
      # Traefik does NOT expand environment variables in this file - this must
      # be a literal address. Change it per deployment.
      email: ea.cloudhost@gmail.com
      storage: /letsencrypt/acme.json
      # Uncomment while testing to avoid Let's Encrypt rate limits.
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

log:
  level: WARN

# Access log goes to stdout so Docker's json-file driver rotates it. Writing
# to a bind-mounted file instead means it grows without bound - Traefik does
# not rotate its own logs. bufferingSize batches writes to cut per-request I/O.
accessLog:
  format: json
  bufferingSize: 100
