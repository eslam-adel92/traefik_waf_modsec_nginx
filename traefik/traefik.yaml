global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  # No authentication. Safe only because the compose file publishes port 8080
  # to 127.0.0.1 exclusively. Do not expose it on 0.0.0.0.
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        # Long enough for large uploads on the `waf-uploads` chain. A long
        # read timeout is what makes slowloris possible; the bound on it is
        # the `inflight` middleware, which caps concurrent requests per IP.
        # Lower this if you do not serve large uploads.
        readTimeout: "600s"
        # No write timeout, so long downloads/streaming are not cut off.
        writeTimeout: "0s"
        idleTimeout: "180s"
      lifeCycle:
        graceTimeOut: "10s"
    http:
      # TLS on by default using Traefik's self-signed certificate. Routers opt
      # into ACME individually with `tls.certresolver=letsencrypt` (driven by
      # CERT_RESOLVER in .env), so routers that cannot get a public cert - the
      # bare-IP catch-all, or any .localhost/.test domain - never trigger
      # failing ACME requests against your rate limit.
      tls: {}

serversTransport:
  forwardingTimeouts:
    dialTimeout: "30s"
    responseHeaderTimeout: "600s"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: webproxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

experimental:
  plugins:
    modsecurity:
      moduleName: github.com/acouvreur/traefik-modsecurity-plugin
      version: v1.3.0

certificatesResolvers:
  letsencrypt:
    acme:
      # Traefik does NOT expand environment variables in this file - this must
      # be a literal address. Change it per deployment.
      email: ea.cloudhost@gmail.com
      storage: /letsencrypt/acme.json
      # Uncomment while testing to avoid Let's Encrypt rate limits.
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

log:
  level: WARN

# Access log goes to stdout so Docker's json-file driver rotates it. Writing
# to a bind-mounted file instead means it grows without bound - Traefik does
# not rotate its own logs. bufferingSize batches writes to cut per-request I/O.
accessLog:
  format: json
  bufferingSize: 100
