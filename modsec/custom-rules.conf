# ---- Node / JavaScript ----------------------------------------------------
# Prototype-pollution keys in JSON or query input.
#
# SecRule ARGS_NAMES "@rx (?:^|\.|\[)(?:__proto__|constructor|prototype)(?:$|\.|\])" \
