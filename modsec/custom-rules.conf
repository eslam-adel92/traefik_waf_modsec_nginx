# Custom ModSecurity rules.
#
# Mounted at /etc/modsecurity.d/owasp-crs/plugins/custom-after.conf, which CRS
# includes AFTER all of its own rules. That placement is required: files under
# rules/ with a numeric prefix (e.g. 100-custom-rules.conf) are globbed first,
# and ctl:ruleRemoveById is resolved at parse time - so an exclusion written
# there silently does nothing because the CRS rule does not exist yet.
#
# ID ranges: 1200-1299 = custom detection, 5000-5999 = exclusions/tuning.
# CRS owns 900000+ - never reuse those IDs.
#
# WHAT BELONGS HERE
# Almost nothing. CRS already covers SQLi, XSS, RCE, traversal, scanners,
# protocol abuse and more, far better than a hand-written rule will. Add a
# rule here only for something CRS genuinely does not do. Everything below is
# either app-agnostic or commented out as an opt-in profile.
#
# ARCHITECTURE NOTE
# This WAF sits behind the Traefik ModSecurity plugin, which forwards only a
# COPY of the request and then replays the original to the real service. The
# real response never passes through ModSecurity, so response-phase rules
# (phase 4 / RESPONSE_BODY) cannot work here and outbound anomaly scoring is
# inert. Do not add rules that inspect responses.


# ===========================================================================
# 1. PER-HOST TUNING
# ===========================================================================
# Find what actually fired before writing an exclusion:
#
#   docker compose logs modsecurity | grep -o '"ruleId":[0-9]*' \
#     | sort | uniq -c | sort -rn
#
# MATCH ON X-Forwarded-Host, NOT Host.
# The plugin reaches this container over its own HTTP connection, so the Host
# header the WAF sees is literally "modsecurity:8080". The client's real
# hostname arrives only in X-Forwarded-Host. A rule keyed on Host can never
# match here.
#
# That is safe on two conditions, both of which this stack satisfies:
#   1. Traefik overwrites X-Forwarded-* for untrusted clients, so a browser
#      cannot forge it. Never set `forwardedHeaders.insecure: true` or add
#      untrusted `forwardedHeaders.trustedIPs` in traefik.yaml.
#   2. The WAF is on the `internal` network only. If it were reachable from
#      the shared webproxy network, anything there could forge the header and
#      turn every exclusion below into an open bypass.
#
# Example - remove one CRS rule for one host:
#
# SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx (?i)^(?:[\w-]+\.)*example\.com(?::\d+)?$" \
#     "id:5000,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ctl:ruleRemoveById=920272"
#
# Narrower - remove it for ONE parameter only, keeping the rule active
# everywhere else. Prefer this form:
#
# SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx (?i)^(?:[\w-]+\.)*example\.com(?::\d+)?$" \
#     "id:5002,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ctl:ruleRemoveTargetById=920272;ARGS:body"
#
# Last-resort escape hatch. DetectionOnly still logs what WOULD have been
# blocked, so the host keeps producing the data you need to write a real
# exclusion. Never ship "ctl:ruleEngine=Off" - it logs nothing, and you lose
# any way to tell whether the host is being attacked.
#
# SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx (?i)^(?:[\w-]+\.)*example\.com(?::\d+)?$" \
#     "id:5001,\
#     phase:1,\
#     pass,\
#     nolog,\
#     ctl:ruleEngine=DetectionOnly"


# ===========================================================================
# 2. GENERIC RULES (active - apply to any application)
# ===========================================================================

# Source-control and credential files. Framework-independent: every stack
# leaks something through one of these if it is served by mistake.
SecRule REQUEST_FILENAME "@rx (?:^|/)\.(?:git|svn|hg|bzr)(?:/|$)|(?:^|/)\.(?:env(?:\.[\w-]+)?|htpasswd|htaccess|npmrc|dockerignore)$" \
    "id:1200,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to sensitive dotfile or VCS directory blocked',\
    severity:'CRITICAL',\
    tag:'custom-sensitive-files',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"

# Dependency/build manifests. Harmless to serve in theory, but they fingerprint
# your exact dependency versions for an attacker picking a CVE.
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|gemfile(?:\.lock)?|requirements\.txt|pipfile(?:\.lock)?|go\.(?:mod|sum)|cargo\.(?:toml|lock)|dockerfile|docker-compose\.ya?ml)$" \
    "id:1201,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to dependency/build manifest blocked',\
    severity:'WARNING',\
    tag:'custom-sensitive-files',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"

# Backup, swap and editor droppings left next to deployed files.
SecRule REQUEST_FILENAME "@rx \.(?:bak|old|orig|save|swp|swo|tmp|orig|rej)$|~$|\.(?:sql|sqlite3?|db|dump)$" \
    "id:1202,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to backup/database file blocked',\
    severity:'CRITICAL',\
    tag:'custom-sensitive-files',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"


# ===========================================================================
# 3. OPTIONAL APPLICATION PROFILES (all commented - enable per deployment)
# ===========================================================================
# This gateway fronts different kinds of app, so nothing below is on by
# default. Uncomment only the block matching the app behind this host, and
# scope it with X-Forwarded-Host if the gateway serves more than one app.

# ---- PHP / Laravel --------------------------------------------------------
# PHP object injection. Anchored: an unanchored ^[OC]:\d+ pattern matches
# ordinary values like "INFO:200:" and blocks legitimate traffic.
#
# SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES "@rx ^[OC]:\d+:\"" \
#     "id:1210,\
#     phase:2,\
#     deny,\
#     status:403,\
#     log,\
#     msg:'PHP object injection attempt (serialized object in input)',\
#     severity:'CRITICAL',\
#     tag:'custom-php'"
#
# Laravel/Symfony internals that should never be web-reachable.
#
# SecRule REQUEST_FILENAME "@rx (?:^|/)(?:storage|bootstrap/cache|vendor|artisan|telescope|horizon)(?:/|$)" \
#     "id:1211,\
#     phase:1,\
#     deny,\
#     status:403,\
#     log,\
#     msg:'Access to Laravel internal path blocked',\
#     severity:'CRITICAL',\
#     tag:'custom-php'"

# ---- WordPress ------------------------------------------------------------
# SecRule REQUEST_FILENAME "@rx (?:^|/)(?:wp-config\.php|xmlrpc\.php|wp-content/debug\.log)$" \
