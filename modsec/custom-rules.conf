# ===========================================================================
# REMOVED IN THE 2026-07 REWRITE - and why.
# Recover any of them with: git log -p -- modsec/custom-rules.conf
# ===========================================================================
# id:5000  ruleEngine=Off for a host
#          Disabled ALL protection for that host, including logging. It was
#          added to silence browser "CORS errors" that were really WAF 403s.
#          Replaced by the scoped exclusions in section 1.
#
# id:1000/1001  @detectSQLi / @detectXSS
#          Duplicated CRS 942xxx/941xxx less accurately, and ran against
#          REQUEST_HEADERS too. Pure false-positive surface.
#
# id:1002  REQUEST_URI|ARGS "@contains .."
#          Blocked any request containing two dots anywhere - "wait..what" in
#          a text field, version strings. CRS 930xxx covers traversal.
#
# id:1003/1004  "API rate limiting"
#          Never worked: no `initcol`, no counter increment, and
#          &IP:REQUEST_COUNT counts variables (0 or 1), not requests - so the
#          @gt 600 test was always false. Rate limiting is now Traefik's
#          `ratelimit` middleware, which enforces it before the WAF hop.
#
# id:1103  Mass assignment
#          Blocked every JSON POST whose body contained "id" - i.e. nearly
#          every REST API call.
#
# id:1104  "CSRF protection"
#          Blocked every POST/PUT/DELETE/PATCH outside /api/ lacking an
#          X-CSRF-TOKEN header. Laravel sends its token as the `_token` FORM
#          FIELD, so this broke normal form posts while providing no real CSRF
#          protection. A prime cause of the "CORS errors" on cross-origin POST.
#
# id:1105  RESPONSE_BODY "@contains stack_trace"
#          Cannot work - see the architecture note; it only ever saw the dummy
#          backend's response.
#
# id:1107  Broad SQL/command keyword regex
#          Matched the bare words exec|eval|system|passthru anywhere in URI,
#          args OR headers. Searching for "operating system" returned 403.
#
# id:1109  Log injection: [\n\r] in ARGS
#          Blocked any newline in any input - every multi-line textarea and
#          every pretty-printed JSON body.
