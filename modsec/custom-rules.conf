#     log,\
#     msg:'Prototype pollution attempt',\
#     severity:'CRITICAL',\
#     tag:'custom-nodejs'"
#
# Source maps and build metadata in production.
#
# SecRule REQUEST_FILENAME "@rx \.map$|(?:^|/)(?:\.next|\.nuxt|node_modules)(?:/|$)" \
#     "id:1231,\
#     phase:1,\
#     deny,\
#     status:403,\
#     log,\
#     msg:'Access to source map or build directory blocked',\
#     severity:'WARNING',\
#     tag:'custom-nodejs'"

