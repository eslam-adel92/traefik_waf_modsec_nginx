# Custom ModSecurity rules.
#
# Mounted at /etc/modsecurity.d/owasp-crs/plugins/custom-after.conf, which CRS
# includes AFTER all of its own rules. That placement is required: files under
# rules/ with a numeric prefix (e.g. 100-custom-rules.conf) are globbed first,
# and ctl:ruleRemoveById is resolved at parse time - so an exclusion written
# there silently does nothing because the CRS rule does not exist yet.
#
# ID ranges: 1200-1299 = custom detection, 5000-5999 = exclusions/tuning.
# CRS owns 900000+ - never reuse those IDs.
#
# EVERYTHING BELOW IS ACTIVE. There is nothing to uncomment on a server: this
# file is the whole configuration and the repo is the only place it is edited.
#
# One gateway fronts several kinds of application at once, so every rule here
# must be safe against ALL of them, not just the stack it targets. Patterns are
# therefore written to hit attacker-only paths and to leave the legitimate
# lookalikes alone. The tests in scripts/smoke-test.sh pin that behaviour -
# each rule has both a "blocks the attack" and a "allows the real thing" case.
#
# ARCHITECTURE NOTE
# This WAF sits behind the Traefik ModSecurity plugin, which forwards only a
# COPY of the request and then replays the original to the real service. The
# real response never passes through ModSecurity, so response-phase rules
# (phase 4 / RESPONSE_BODY) cannot work here and outbound anomaly scoring is
# inert. Do not add rules that inspect responses.


# ===========================================================================
# 1. PER-HOST TUNING
# ===========================================================================
# Find what actually fired before writing an exclusion:
#
#   make triggered
#
# MATCH ON X-Forwarded-Host, NOT Host.
# The plugin reaches this container over its own HTTP connection, so the Host
# header the WAF sees is literally "modsecurity:8080". The client's real
# hostname arrives only in X-Forwarded-Host. A rule keyed on Host can never
# match here.
#
# That is safe on two conditions, both of which this stack satisfies:
#   1. Traefik overwrites X-Forwarded-* for untrusted clients, so a browser
#      cannot forge it. Never set `forwardedHeaders.insecure: true` or add
#      untrusted `forwardedHeaders.trustedIPs` in traefik.yaml.
#   2. The WAF is on the `internal` network only. If it were reachable from
#      the shared webproxy network, anything there could forge the header and
#      turn every exclusion below into an open bypass.
#
# Example - remove one rule for one host:
#
# SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx (?i)^(?:[\w-]+\.)*example\.com(?::\d+)?$" \
#     "id:5000,phase:1,pass,nolog,ctl:ruleRemoveById=920272"
#
# Narrower - remove it for ONE parameter only, keeping the rule active
# everywhere else. Prefer this form:
#
# SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx (?i)^(?:[\w-]+\.)*example\.com(?::\d+)?$" \
#     "id:5002,phase:1,pass,nolog,ctl:ruleRemoveTargetById=920272;ARGS:body"
#
# Last-resort escape hatch. DetectionOnly still logs what WOULD have been
# blocked, so the host keeps producing the data you need to write a real
# exclusion. Never ship "ctl:ruleEngine=Off" - it logs nothing, and you lose
# any way to tell whether the host is being attacked.
#
# SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx (?i)^(?:[\w-]+\.)*example\.com(?::\d+)?$" \
#     "id:5001,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"


# ---------------------------------------------------------------------------
# APPLICATION COMPATIBILITY
#
# Keyed on PATH, never on hostname. This file is public, and naming a real
# host next to "these rule families are disabled here" publishes a map of
# where a specific production system's WAF coverage is thinnest.
#
# Host-specific tuning belongs in site-rules.conf instead - see the
# SITE_RULES_FILE note in .env.example. That file is gitignored.
#
# ---- 5010: Grafana datasource queries -------------------------------------
# /api/ds/query is Grafana-specific; anything serving it is Grafana. It
# carries PromQL and LogQL, and a query language is structurally
# indistinguishable from injection: rate(node_cpu_seconds_total[5m]) and
# {job="x"} trip the whole SQLi family, the RCE family, and 941380 (AngularJS
# template injection, because Grafana templating uses {{...}}).
#
# Measured on a live instance: 942100 942131 942150 942200 942370 942410
# 942430 942510, 932200 932240 932281 and 941380, peaking at anomaly score 58
# against a threshold of 10 - i.e. every dashboard refresh would have 403'd.
#
# Removed by tag rather than by ID, because the set of rules an arbitrary
# dashboard query trips is open-ended. XSS (other than 941380), LFI, scanner
# and protocol rules stay ACTIVE here - an XSS probe at this path still 403s.
SecRule REQUEST_URI "@beginsWith /api/ds/query" \
    "id:5010,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-sqli,\
    ctl:ruleRemoveByTag=attack-rce,\
    ctl:ruleRemoveById=941380"


# ---- 5011: Grafana datasource RESOURCE PROXY ------------------------------
# The sibling of 5010, and needed for the same reason. 5010 covers /api/ds/query
# (panel data). It does NOT cover the resource proxy, which is what template
# variables use - label_values() issues:
#
#   GET /api/datasources/uid/<uid>/resources/api/v1/label/<label>/values
#         ?match[]=up{job="node_exporter", product=~"display-pulse", env=~".*"}
#
# so a PromQL/LogQL selector arrives as a QUERY PARAMETER rather than a JSON
# body. Same query language, same structural collision with the SQLi signatures,
# different path - so 5010's exclusion never applied and every chained variable
# 403'd.
#
# Measured on a live instance, on the selectors above: 942120 942200 942370
# 942430 (attack-sqli) and 941330 941340 (the IE XSS Filters rules, which match
# on punctuation runs like `"", name!=`). Anomaly scores 10-18 against a
# threshold of 10.
#
# It only bites on non-trivial selectors, which is why it can hide for a long
# time: `up{job="node_exporter"}` scores under 10 and passes, while adding a
# second or third matcher - `product=~"...", env=~".*"` - crosses it. A dashboard
# whose variables are independent works; make them CHAINED and every one breaks.
#
# Tag-based for sqli/rce like 5010, because what an arbitrary selector trips is
# open-ended. The two XSS rules are dropped BY ID, not by tag: attack-xss stays
# active at this path, so a genuine XSS probe here still 403s. LFI, scanner,
# session and protocol rules are untouched.
SecRule REQUEST_URI "@rx ^/api/datasources/(?:proxy/|(?:uid/[^/]+|[0-9]+)/resources/)" \
    "id:5011,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-sqli,\
    ctl:ruleRemoveByTag=attack-rce,\
    ctl:ruleRemoveById=941330,\
    ctl:ruleRemoveById=941340,\
    ctl:ruleRemoveById=941380"


# ===========================================================================
# 2. EXPOSED FILES AND DIRECTORIES
# ===========================================================================

# Source control, credentials and OS/editor droppings. Framework-independent:
# every stack leaks something through one of these if it is served by mistake.
SecRule REQUEST_FILENAME "@rx (?:^|/)\.(?:git|svn|hg|bzr|idea|vscode)(?:/|$)|(?:^|/)\.(?:env(?:\.[\w-]+)?|htpasswd|htaccess|npmrc|dockerignore|ds_store)$" \
    "id:1200,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to sensitive dotfile or VCS directory blocked',\
    severity:'CRITICAL',\
    tag:'custom-exposed-files',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"

# Dependency/build manifests. Harmless to serve in theory, but they fingerprint
# your exact dependency versions for an attacker picking a CVE.
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|gemfile(?:\.lock)?|requirements\.txt|pipfile(?:\.lock)?|go\.(?:mod|sum)|cargo\.(?:toml|lock)|dockerfile|docker-compose\.ya?ml)$" \
    "id:1201,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to dependency/build manifest blocked',\
    severity:'WARNING',\
    tag:'custom-exposed-files',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"

# Backups, database dumps and editor swap files left next to deployed code.
SecRule REQUEST_FILENAME "@rx \.(?:bak|old|orig|save|swp|swo|tmp|rej)$|~$|\.(?:sql|sqlite3?|db|dump)$" \
    "id:1202,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to backup/database file blocked',\
    severity:'CRITICAL',\
    tag:'custom-exposed-files',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"

# Web server status pages. Leak internal URLs, client IPs and version strings.
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:server-status|server-info|nginx_status|status\.php)$" \
    "id:1203,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to web server status endpoint blocked',\
    severity:'WARNING',\
    tag:'custom-exposed-files',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"


# ===========================================================================
# 3. PHP / LARAVEL
# ===========================================================================

# PHP object injection. Anchored to the start of the value and requiring the
# quote that follows a real serialized object: an unanchored ^[OC]:\d+ pattern
# matches ordinary values like "INFO:200:" and blocks legitimate traffic.
# Harmless in front of non-PHP apps - nothing legitimate starts with O:12:".
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES "@rx ^[OC]:\d+:\"" \
    "id:1210,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'PHP object injection attempt (serialized object in input)',\
    severity:'CRITICAL',\
    tag:'custom-php'"

# Executable code under framework directories.
#
# Deliberately NOT a blanket block on /storage, /vendor or /bootstrap: Laravel's
# `artisan storage:link` serves real user uploads from /storage/..., and plenty
# of sites serve CSS/JS from /vendor/... Blocking those directories wholesale
# breaks working applications. Only reachable *code* is blocked here.
SecRule REQUEST_FILENAME "@rx (?:^|/)artisan$|(?:^|/)(?:vendor|bootstrap|storage|app|config|database|routes)/.*\.(?:php|phtml|phar|env|key|log)$" \
    "id:1211,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to PHP framework code path blocked',\
    severity:'CRITICAL',\
    tag:'custom-php',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"

# Diagnostic scripts that should never reach production.
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:phpinfo|adminer|_profiler)(?:\.php)?$|(?:^|/)php_?info\.php$" \
    "id:1212,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to PHP diagnostic endpoint blocked',\
    severity:'CRITICAL',\
    tag:'custom-php',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"


# ===========================================================================
# 4. WORDPRESS
# ===========================================================================
# Safe in front of any stack: nothing but WordPress serves these names, so on
# a non-WordPress app these only ever match scanners probing for one.
#
# /wp-admin and /wp-login.php are NOT blocked - they are how the site is
# administered. Brute force against them is handled by the `ratelimit`
# middleware, not here.
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:wp-config\.php|xmlrpc\.php|wp-config-sample\.php)$|(?:^|/)wp-content/(?:debug\.log|uploads/.*\.php)$" \
    "id:1220,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to WordPress sensitive endpoint blocked',\
    severity:'CRITICAL',\
    tag:'custom-wordpress',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"


# ===========================================================================
# 5. NODE / JAVASCRIPT
# ===========================================================================

# Prototype pollution. Matches only the actual attack shapes (__proto__, and
# constructor followed by prototype). A bare `prototype` or `constructor`
# parameter name is left alone - those appear in legitimate APIs.
SecRule ARGS_NAMES|ARGS "@rx (?:^|[.\[])__proto__(?:$|[.\[\]])|(?:^|[.\[])constructor[.\[]\s*[\"']?prototype" \
    "id:1230,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Prototype pollution attempt',\
    severity:'CRITICAL',\
    tag:'custom-nodejs'"

# Build output and dependency trees that should never be web-reachable.
# Note the leading dot: Next.js serves its assets from /_next/, not /.next/,
# so this does not touch a working Next.js or Nuxt deployment.
#
# Source maps (*.js.map, *.css.map) are deliberately NOT blocked here. They
# do leak original source, but plenty of applications ship them on purpose -
# Grafana serves them under /public/ and this rule 403'd them on the first
# real deployment it met. Blocking them is a per-application decision, not a
# safe default for a gateway that fronts several kinds of app. To block them
# for an app that should not serve them, add this to site-rules.conf:
#
#   SecRule REQUEST_FILENAME "@rx \.(?:js|css)\.map$" \
#       "id:5100,phase:1,deny,status:403,log,msg:'Source map access blocked'"
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:node_modules|\.next|\.nuxt|\.svelte-kit|bower_components)(?:/|$)" \
    "id:1231,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to build artifact or dependency directory blocked',\
    severity:'WARNING',\
    tag:'custom-nodejs',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"


# ===========================================================================
# 6. JAVA / SPRING / .NET
# ===========================================================================
# Management endpoints and container internals. Safe in front of any stack for
# the same reason as the WordPress block: no non-Java app serves these paths.
#
# A bare /env is deliberately NOT blocked - too generic a path to claim.
# Spring exposes it at /actuator/env, which this does cover.
# ---------------------------------------------------------------------------
# CRS 931130 is structurally inert in this architecture - remove it, and
# replace the one thing it was incidentally catching.
#
# 931130 ("RFI: Off-Domain Reference/Link") is chained on:
#     SecRule TX:/rfi_parameter_.*/ "!@endsWith .%{request_headers.host}"
# The plugin opens its OWN connection to the WAF, so request_headers.host is
# always "modsecurity:8080". No real URL ends with that, so the negated match is
# ALWAYS true: every url-bearing parameter scores CRITICAL, including an
# application's own links. It cannot distinguish off-domain from same-domain
# here, so it contributes noise rather than signal.
#
# One URL scores 5 against a threshold of 10, which is why this hides: ordinary
# pages are unaffected and it only bites when a request carries a second
# scoring rule or several URLs. Observed three times in one morning on one
# deployment - payment webhooks (6-10 URL fields), a payment-return page, and an
# orders endpoint whose JSON body carried the site's own product image URLs.
#
# Removing it measurably costs one thing: `?f=php://input` dropped from 403 to
# 200. Rule 1242 below covers that case directly and precisely, so the net
# position is better than leaving 931130 in.
SecAction \
    "id:1243,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=931130"

# PHP/stream wrapper in a parameter - the real LFI/RFI vector that 931130 was
# incidentally covering. Matched directly instead of by anomaly scoring.
# "data" is deliberately absent: data:// is already caught elsewhere, and
# excluding it keeps legitimate `data:image/...;base64,` values (which have no
# "//") well clear.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES "@rx (?i)(?:^|[^\w.])(?:php|phar|expect|zip|glob|ogg|rar|zlib|compress\.(?:zlib|bzip2)|ssh2(?:\.[a-z]+)?)://" \
    "id:1242,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'PHP/stream wrapper in parameter (LFI/RFI)',\
    severity:'CRITICAL',\
    tag:'custom-php',\
    t:none,t:urlDecodeUni,t:lowercase"

# JNDI lookup (log4shell, CVE-2021-44228 and relatives).
#
# The brace is OPTIONAL in this pattern, and that is the whole point. A payload
# sent with literal braces in the query string reaches the WAF with the braces
# STRIPPED - verified by reading what the WAF was handed:
#     sent:     /?x=${jndi:ldap://host/a}
#     WAF saw:  /?x=$jndi:ldap://host/a
# so any rule anchored on "${" - including CRS's own 944xxx - cannot match it.
# The urlencoded form works only because %7B survives as literal text and is
# decoded by t:urlDecodeUni after the pattern has already matched.
#
# Verified before the fix: urlencoded query, a header and a JSON body all 403'd
# while the raw-brace query returned 200.
#
# "http" is deliberately NOT in the alternation - without a required brace it
# would match ordinary strings. Nothing legitimate contains "$jndi:" or "$ldap:".
SecRule REQUEST_URI|ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES "@rx (?i)\$\{?\s*(?:jndi|ldap|rmi|iiop|corba|nds)\s*:" \
    "id:1241,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'JNDI lookup attempt (log4shell)',\
    severity:'CRITICAL',\
    tag:'custom-java',\
    t:none,t:urlDecodeUni"

SecRule REQUEST_FILENAME "@rx (?:^|/)(?:actuator|jolokia|heapdump|threaddump|hawtio)(?:/|$)|(?:^|/)(?:web-inf|meta-inf)(?:/|$)|(?:^|/)(?:trace\.axd|elmah\.axd)$" \
    "id:1240,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Access to application management endpoint blocked',\
    severity:'CRITICAL',\
    tag:'custom-java',\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"


# ===========================================================================
# REMOVED IN THE 2026-07 REWRITE - and why.
# Recover any of them with: git log -p -- modsec/custom-rules.conf
# ===========================================================================
# id:5000  ruleEngine=Off for a host
#          Disabled ALL protection for that host, including logging. It was
#          added to silence browser "CORS errors" that were really WAF 403s.
#          Replaced by the scoped exclusions in section 1.
#
# id:1000/1001  @detectSQLi / @detectXSS
#          Duplicated CRS 942xxx/941xxx less accurately, and ran against
#          REQUEST_HEADERS too. Pure false-positive surface.
#
# id:1002  REQUEST_URI|ARGS "@contains .."
#          Blocked any request containing two dots anywhere - "wait..what" in
#          a text field, version strings. CRS 930xxx covers traversal.
#
# id:1003/1004  "API rate limiting"
#          Never worked: no `initcol`, no counter increment, and
#          &IP:REQUEST_COUNT counts variables (0 or 1), not requests - so the
#          @gt 600 test was always false. Rate limiting is now Traefik's
#          `ratelimit` middleware, which enforces it before the WAF hop.
#
# id:1103  Mass assignment
#          Blocked every JSON POST whose body contained "id" - i.e. nearly
#          every REST API call.
#
# id:1104  "CSRF protection"
#          Blocked every POST/PUT/DELETE/PATCH outside /api/ lacking an
#          X-CSRF-TOKEN header. Laravel sends its token as the `_token` FORM
#          FIELD, so this broke normal form posts while providing no real CSRF
#          protection. A prime cause of the "CORS errors" on cross-origin POST.
#
# id:1105  RESPONSE_BODY "@contains stack_trace"
#          Cannot work - see the architecture note; it only ever saw the dummy
#          backend's response.
#
# id:1107  Broad SQL/command keyword regex
#          Matched the bare words exec|eval|system|passthru anywhere in URI,
#          args OR headers. Searching for "operating system" returned 403.
#
# id:1109  Log injection: [\n\r] in ARGS
#          Blocked any newline in any input - every multi-line textarea and
#          every pretty-printed JSON body.
